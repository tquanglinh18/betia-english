<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đại lý Betia</title>
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./assets/css/main.css" />
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/styles-scss.css" />


</head>

<body>
    <section>
        <div class="page-layout">
            <div class="page-navigate">
                <div class="logo-betia">
                    <a href="~/">
                        <img src="./assets/images/logo_betia.png" alt="">
                    </a>
                </div>

                <div class="lst-tab-nav">
                    <div class="nav-item nav-item--active">
                        Thông tin tài khoản
                    </div>

                    <div class="nav-item">
                        Sản phẩm
                    </div>

                    <div class="nav-item">
                        Đại lý trực thuộc
                    </div>

                    <div class="nav-item">
                        Doanh thu
                    </div>

                    <div class="nav-item">
                        Chờ thanh toán
                    </div>

                    <div class="nav-item">
                        Chờ thanh toán
                    </div>

                    <div class="nav-item">
                        Lịch sử
                    </div>
                </div>

                <div class="account-action">
                    <button type="button" class="btn-base">
                        Đăng xuất
                    </button>
                </div>
            </div>
            <div class="page-content">
                <div class="section">
                    <div class="section__header">

                        <div class="user">
                            <div class="user--name">Hello &nbsp <span>Trần Quang Linh</span></div>
                            <div class="user--goID">goID:&nbsp <span>1300532222</span></div>
                            <div class="user--account-type">Tài khoản đại lý</div>
                            <div class="user--total-go">Số dư: &nbsp <span> 0 </span>&nbsp Go</div>
                        </div>
                    </div>

                    <div class="section__body">
                        <div id="infor-user" class="container-box">
                            <div class="container-box__header">
                                <h3>Tài khoản</h3>
                            </div>

                            <div class="container-box__body">
                                <div class="input-field">
                                    <label for="fullname">Họ và tên</label>
                                    <input type="text" name="fullname" id="fullname" placeholder="Họ và tên"
                                        value="Tran Quang Linh" disabled>
                                </div>

                                <div class="input-field">
                                    <label for="username">Tên đăng nhập</label>
                                    <input type="text" name="username" id="username" placeholder="Tên đăng nhập"
                                        value="linhtq" disabled>
                                </div>

                                <div class="input-field">
                                    <label for="email">Email</label>
                                    <input type="text" name="email" id="email" placeholder="Email"
                                        value="linhtq@vtconline.vn" disabled>
                                </div>

                                <div class="input-field">
                                    <label for="phone">Số điện thoại</label>
                                    <input type="text" name="phone" id="phone" placeholder="Số điện thoại"
                                        value="0123456789" disabled>
                                </div>
                            </div>

                            <div class="container-box__footer">

                            </div>
                        </div>

                        <div id="invite-friend" class="container-box">
                            <div class="container-box__header">
                                <h3>Tài khoản</h3>
                            </div>

                            <div class="container-box__body">
                                <p>Dùng mã , link hoặc dùng QR để giới thiệu đến bạn bè của bạn</p>

                                <div class="input-field">
                                    <label for="invite-number">Mã giới thiệu của bạn</label>
                                    <input type="text" name="invite-number" id="invite-number"
                                        placeholder="Mã giới thiệu của bạn" value="010101010101" disabled>

                                    <button type="button" class="btn-base btn-base--gradient">Copy</button>
                                </div>

                                <div class="input-field">
                                    <label for="invite-link">Link giới thiệu của bạn</label>
                                    <input type="text" name="invite-link" id="invite-link"
                                        placeholder="Link giới thiệu của bạn"
                                        value="https://betiaenglish/daily/1jsdhfjkshfkakdjakjsdkasjdklasjhfjhsdf"
                                        disabled>

                                    <button type="button" class="btn-base btn-base--gradient">Copy</button>
                                </div>

                                <div class="invite-qr-code">
                                    <img src="https://play-lh.googleusercontent.com/_OSB1gXiLCDa8Wj1HPBvDuMuUmrs_sB_3GZ5RdgbU7Diuz905jQx1HB9tDZMj62A0xQ=w240-h480-rw"
                                        alt="">
                                </div>
                            </div>

                            <div class="container-box__footer">

                            </div>
                        </div>
                    </div>

                    <div class="section__footer">

                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="./assets/js/jquery-3.7.1.min.js"></script>
    <script src="./assets/js/bootstrap.min.js"></script>
    <script src="./assets/js/main.js"></script>


</body>

</html>

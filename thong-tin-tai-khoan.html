<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đại lý Betia</title>
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./assets/css/main.css" />
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/styles-scss.css" />


</head>

<body>
    <header>
        <div id="menu-mobile" class="menu-mobile">
          <button id="menu-mobile__toggle" class="menu-mobile__toggle" aria-label="Open Menu Open">
            <img src="./assets/images/ic_menu_mobile.png" alt="">
          </button>
          <ul id="menu-mobile__list" class="menu-mobile__list">
            <div class="logo-betia">
              <a href="~/">
                <img src="./assets/images/logo_betia.png" alt="">
              </a>
            </div>
    
            <div class="lst-tab-nav nav nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
              <a class="nav-link active" id="thong-tin-tao-khoan-tab" data-toggle="pill" href="#thong-tin-tao-khoan"
                role="tab" aria-controls="thong-tin-tao-khoan" aria-selected="true">
                Thông tin tài khoản
              </a>
    
              <a class="nav-link " id="products-tab" data-toggle="pill" href="#products" role="tab" aria-controls="products"
                aria-selected="false">
                Sản phẩm
              </a>
    
              <a class="nav-link " id="affiliated-agent-tab" data-toggle="pill" href="#affiliated-agent" role="tab"
                aria-controls="affiliated-agent" aria-selected="false">
                Đại lý trực thuộc
              </a>
    
              <a class="nav-link " id="revenue-tab" data-toggle="pill" href="#revenue" role="tab" aria-controls="revenue"
                aria-selected="false">
                Doanh thu
              </a>
    
              <a class="nav-link " id="payment-waiting-tab" data-toggle="pill" href="#payment-waiting" role="tab"
                aria-controls="payment-waiting" aria-selected="false">
                Chờ thanh toán
              </a>
    
              <a class="nav-link " id="payment-history-tab" data-toggle="pill" href="#payment-history" role="tab"
                aria-controls="payment-history" aria-selected="false">
                Lịch sử
              </a>
            </div>
    
            <div class="account-action">
              <button type="button" class="btn-base">
                Đăng xuất
              </button>
            </div>
          </ul>
        </div>
      </header>
    <section>
        <div class="page-layout">
            <div class="page-navigate">
                <div class="logo-betia">
                    <a href="~/">
                        <img src="./assets/images/logo_betia.png" alt="">
                    </a>
                </div>

                <div class="lst-tab-nav nav nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                    <a class="nav-link active" id="thong-tin-tao-khoan-tab" data-toggle="pill"
                        href="#thong-tin-tao-khoan" role="tab" aria-controls="thong-tin-tao-khoan" aria-selected="true">
                        Thông tin tài khoản
                    </a>

                    <a class="nav-link " id="products-tab" data-toggle="pill" href="#products" role="tab"
                        aria-controls="products" aria-selected="false">
                        Sản phẩm
                    </a>

                    <a class="nav-link " id="affiliated-agent-tab" data-toggle="pill" href="#affiliated-agent"
                        role="tab" aria-controls="affiliated-agent" aria-selected="false">
                        Đại lý trực thuộc
                    </a>

                    <a class="nav-link " id="revenue-tab" data-toggle="pill" href="#revenue" role="tab"
                        aria-controls="revenue" aria-selected="false">
                        Doanh thu
                    </a>

                    <a class="nav-link " id="payment-waiting-tab" data-toggle="pill" href="#payment-waiting" role="tab"
                        aria-controls="payment-waiting" aria-selected="false">
                        Chờ thanh toán
                    </a>

                    <a class="nav-link " id="payment-history-tab" data-toggle="pill" href="#payment-history" role="tab"
                        aria-controls="payment-history" aria-selected="false">
                        Lịch sử
                    </a>
                </div>

                <div class="account-action">
                    <button type="button" class="btn-base">
                        Đăng xuất
                    </button>
                </div>
            </div>
            <div class="page-content">
                <div id="invite-friend" class="container-box">
                    <div class="container-box__header">
                        <h3>Tài khoản</h3>
                    </div>

                    <div class="container-box__body">
                        <p>Dùng mã , link hoặc dùng QR để giới thiệu đến bạn bè của bạn</p>

                        <div class="input-field">
                            <label for="invite-number">Mã giới thiệu của bạn</label>
                            <div class="input-container">
                                <input type="text" name="invite-number" id="invite-number"
                                    placeholder="Mã giới thiệu của bạn" value="010101010101"
                                    disabled>
                                <button id="btn-invite-number-copy" type="button"
                                    class="btn-base btn-base--gradient">Copy</button>
                            </div>
                        </div>

                        <div class="input-field">
                            <label for="invite-link">Link giới thiệu của bạn</label>
                            <div class="input-container">
                                <input type="text" name="invite-link" id="invite-link"
                                    placeholder="Link giới thiệu của bạn"
                                    value="https://betiaenglish/daily/1jsdhfjkshfkakdjakjsdkasjdklasjhfjhsdf"
                                    disabled>
                                <button id="btn-invite-link-copy" type="button"
                                    class="btn-base btn-base--gradient">Copy</button>
                            </div>
                        </div>

                        <div class="invite-qr-code">
                            <img src="https://play-lh.googleusercontent.com/_OSB1gXiLCDa8Wj1HPBvDuMuUmrs_sB_3GZ5RdgbU7Diuz905jQx1HB9tDZMj62A0xQ=w240-h480-rw"
                                alt="">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="./assets/js/jquery-3.7.1.min.js"></script>
    <script src="./assets/js/bootstrap.min.js"></script>
    <script src="./assets/js/main.js"></script>


</body>

</html>
